system: |
  You are a precise job description evaluator. You return only valid JSON, no markdown, no explanation.

user: |
  You are evaluating a job description for a candidate with the following profile:
  {candidate_profile}

  Job Description:
  {jd_text}

  ---

  First, extract the company name and role title from the job description.
  If either cannot be determined, use "Unknown".

  Then score the job description against the rubric below. For each item, provide:
  1. A score from 0 to the item's max score
  2. One concise sentence of reasoning (max 20 words)

  Also assess each knockout flag as true (flag raised) or false (not raised).

  {sections_text}

  Knockout flags to assess:
  {knockout_text}

  ---

  Respond ONLY with a JSON object in exactly this format, no preamble, no markdown.
  Include one key per section id for both "scores" and "reasoning":
  {{
    "company": "<extracted company name>",
    "role": "<extracted role title>",
    "scores": {{
      "<section_id>": [<score per item in order>]
    }},
    "reasoning": {{
      "<section_id>": ["<one sentence per item>"]
    }},
    "knockouts": [<true/false per knockout in order>]
  }}