system: |
  You are a precise job description evaluator. You return only valid JSON, no markdown, no explanation.

user: |
  You are evaluating a job description for a candidate with the following profile:
  {candidate_profile}

  Job Description:
  {jd_text}

  ---

  First, extract the company name and role title from the job description.
  If either cannot be determined, use "Unknown".

  Then score the job description against every item in every section of the rubric below.
  For each item you MUST provide:
  1. A score from 0 to the item's max score (integer, never exceed the max)
  2. One concise sentence of reasoning (max 20 words)

  IMPORTANT: Each section's "scores" and "reasoning" arrays MUST contain exactly as many
  elements as that section has items (shown in the section header). Do not skip, merge,
  or omit any items. If information is absent from the JD, give benefit of the doubt and score
  floor(max / 2) for that item (e.g. max=2 → 1, max=3 → 1, max=4 → 2) with reasoning "Not explicitly mentioned."

  Also assess each knockout flag as true (flag raised) or false (not raised).

  {sections_text}

  Knockout flags to assess:
  {knockout_text}

  ---

  Respond ONLY with a JSON object in exactly this format, no preamble, no markdown.
  Each section array must have exactly the number of elements shown in the section header.
  Use each section's integer id as the key. The valid section ids are: {section_ids}.
  {{
    "company": "<extracted company name>",
    "role": "<extracted role title>",
    "scores": {{
      "1": [<one integer per item, in order>]
    }},
    "reasoning": {{
      "1": ["<one sentence per item, in order>"]
    }},
    "knockouts": [<true/false per knockout in order>]
  }}