system: |
  You are a job evaluation rubric designer. You return only valid JSON, no markdown, no explanation.

user: |
  Generate a personalised job evaluation rubric for the following candidate:

  Role target: {role_title}
  Location: {location}
  Compensation range: {currency_symbol}{comp_min}–{currency_symbol}{comp_max}
  Key skills: {skills}
  Background summary: {background_summary}
  Career goals: {career_goals}
  Preferred company size: {company_size_preference}
  Work arrangement: {work_arrangement}

  ---

  The rubric has exactly 5 fixed sections. You MUST use these IDs, titles, and weights exactly as
  shown — do not change them. Only generate the `items` array for each section.

  Fixed sections:
    id: 1, title: "Compensation & Benefits", weight: 30
    id: 2, title: "Role & Technical Fit",    weight: 25
    id: 3, title: "Growth & Learning",       weight: 20
    id: 4, title: "Culture & Team",          weight: 15
    id: 5, title: "Work Arrangement",        weight: 10

  Per section, generate 4–6 items tailored to the candidate's profile.
  Each item has:
    question  — a specific question to score from the job description
    signals   — comma-separated signals to look for in the JD
    max       — integer between 2 and 4 (maximum score for this item)
    labels    — array of exactly (max + 1) strings, one label per score from 0 to max

  Section 1 items must reference the candidate's local currency ({currency_symbol}) and
  expected compensation range ({comp_min}–{comp_max}).

  Also generate:
    - meta: eyebrow, title (with <em> tag), subtitle
    - knockouts: 4–6 flags personalised to this candidate's situation
      Each knockout has: label (human-readable heading), detail (one sentence explaining it)

  Format (follow this schema exactly):
  {{
    "meta": {{
      "eyebrow": "<Role Title> · <Location> · <Year>",
      "title": "Role <em>Evaluator</em>",
      "subtitle": "Score job descriptions against your priorities."
    }},
    "knockouts": [
      {{"label": "<heading e.g. 'Requires 5-day on-site'>", "detail": "<one sentence disqualifier>"}}
    ],
    "sections": [
      {{
        "id": 1,
        "title": "Compensation & Benefits",
        "weight": 30,
        "items": [
          {{
            "question": "<question to score from JD>",
            "signals": "<comma-separated signals>",
            "max": 3,
            "labels": ["<score 0>", "<score 1>", "<score 2>", "<score 3>"]
          }}
        ]
      }},
      {{
        "id": 2,
        "title": "Role & Technical Fit",
        "weight": 25,
        "items": [ ... ]
      }},
      {{
        "id": 3,
        "title": "Growth & Learning",
        "weight": 20,
        "items": [ ... ]
      }},
      {{
        "id": 4,
        "title": "Culture & Team",
        "weight": 15,
        "items": [ ... ]
      }},
      {{
        "id": 5,
        "title": "Work Arrangement",
        "weight": 10,
        "items": [ ... ]
      }}
    ]
  }}

  The current year is 2026.

  Respond ONLY with a JSON object matching the schema above. No preamble, no markdown.
